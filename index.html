<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Digital Invitation</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <section class="hero">
      <img id="coverImage" class="hero-image" alt="Foto utama acara">
      <div class="overlay"></div>
      <div class="hero-content">
        <p id="eventLabel" class="eyebrow">You're Invited</p>
        <h1 id="eventTitle">Special Celebration</h1>
        <p>Kepada Yth.</p>
        <h2 id="guestName">Tamu Undangan</h2>
        <button id="openInvitation">Buka Undangan</button>
      </div>
    </section>

    <section id="content" class="content hidden">
      <section class="card event-card">
        <p id="eventTypeText" class="eyebrow dark">Invitation</p>
        <h3 id="mainName">Nama Acara</h3>
        <p id="subtitle" class="lead"></p>

        <div class="event-meta">
          <div><strong>Tanggal</strong><span id="eventDate">-</span></div>
          <div><strong>Waktu</strong><span id="eventTime">-</span></div>
          <div><strong>Lokasi</strong><span id="eventLocation">-</span></div>
        </div>

        <p id="description" class="description"></p>
      </section>

      <section id="galleryCard" class="card hidden">
        <h3>Galeri</h3>
        <div id="gallery" class="gallery"></div>
      </section>

      <section class="card">
        <h3>Ucapan & Doa</h3>
        <p class="muted">Tinggalkan ucapan untuk pemilik acara.</p>

        <form id="commentForm">
          <label>Nama
            <input id="commentName" maxlength="80" required>
          </label>
          <label>Ucapan
            <textarea id="commentMessage" maxlength="500" required></textarea>
          </label>
          <button type="submit">Kirim Ucapan</button>
          <p id="formStatus" class="status" aria-live="polite"></p>
        </form>

        <div class="comments-head">
          <h4>Ucapan Tamu</h4>
          <span id="commentCount">0 ucapan</span>
        </div>
        <div id="comments" class="comments"></div>
      </section>
    </section>
  </main>
  <script src="/script.js"></script>
</body>
</html>
